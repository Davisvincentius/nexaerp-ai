
name: Deploy NexaERP AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -eu

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker belum terpasang di VPS."
              exit 1
            fi

            if [ ! -d /opt/nexaerp/.git ]; then
              mkdir -p /opt/nexaerp
              git clone https://github.com/Davisvincentius/nexaerp-ai.git /opt/nexaerp
            else
              git -C /opt/nexaerp pull origin main
            fi

            cd /opt/nexaerp/backend

            umask 077
            printf 'DATABASE_URL=%s\n' '${{ secrets.DATABASE_URL }}' > .env

            docker compose up -d --build
